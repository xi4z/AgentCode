mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.agentcode.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_PLUS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      id-type: input
      table-underline: true

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agentcode: ${AGENT_LOG_LEVEL:DEBUG}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/agentcode.log}
