spring:
  application:
    name: ${SPRING_APPLICATION_NAME:agentcode-java}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agentcode?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      # 获取连接超时（毫秒）：避免池耗尽时无限等待拖垮请求线程
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      # 连接最大存活（毫秒，25m）：小于 MySQL wait_timeout，避免使用已被服务端关闭的连接
      max-lifetime: ${DB_MAX_LIFETIME:1500000}
      # 连接有效性校验超时（毫秒）
      validation-timeout: ${DB_VALIDATION_TIMEOUT:3000}

  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: ${DB_SCHEMA_LOCATIONS:classpath:schema.sql}
      continue-on-error: ${DB_INIT_CONTINUE_ON_ERROR:false}

  ai:
    model:
      # openai / dashscope / anthropic / ollama
      chat: ${AI_MODEL_PROVIDER:openai}
      # 长期记忆已改为文件式（FileMemoryStore，markdown + 关键词检索），不再需要 EmbeddingModel；
      # 默认 none 关掉 embedding 自动装配。如未来恢复向量检索，显式设置 provider 即可。
      embedding: ${AI_EMBEDDING_MODEL_PROVIDER:none}
      # 下面这些子模型项目里没有用到，但 spring-ai-starter-model-openai 的对应自动装配
      # 只受 spring.ai.model.<type> 控制：不显式设成 none 时，即使 chat/embedding 走 dashscope，
      # OpenAiAudioSpeechAutoConfiguration 等仍会实例化并要求 spring.ai.openai.api-key，
      # 表现为 "OpenAI API key must be set" 导致启动失败。
      image: ${AI_IMAGE_MODEL:none}
      moderation: ${AI_MODERATION_MODEL:none}
      audio:
        speech: ${AI_AUDIO_SPEECH_MODEL:none}
        transcription: ${AI_AUDIO_TRANSCRIPTION_MODEL:none}

    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}
          max-tokens: ${OPENAI_MAX_TOKENS:8192}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}

    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      # DashScopeApi 按 baseUrl + embeddingsPath 拼接请求地址，
      # 而 embeddingsPath 常量本身已带 "/api/v1"（/api/v1/services/embeddings/text-embedding/text-embedding），
      # 所以这里必须填【不含 /api/v1】的主机地址，否则会拼成 /api/v1/api/v1/... 直接 404。
      # 专属 MaaS 实例写法示例：https://ws-xxxx.cn-beijing.maas.aliyuncs.com
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-max}
          temperature: ${DASHSCOPE_TEMPERATURE:0.7}
          top-p: ${DASHSCOPE_TOP_P:0.8}
          max-tokens: ${DASHSCOPE_MAX_TOKENS:8192}
          stop: ${DASHSCOPE_STOP:}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
    chat:
      client:
        observation-enabled: ${AI_OBSERVATION_ENABLED:true}
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}

agentcode:
  # REST / WebSocket 握手的访问令牌；为空（默认）不启用鉴权，仅限本地开发模式。
  # 配置后要求 Authorization: Bearer <token> 或 ?token=<token>
  api-token: ${AGENTCODE_API_TOKEN:}
  checkpoint:
    redis:
      address: ${REDIS_CHECKPOINT_ADDRESS:redis://127.0.0.1:6379}
      password: ${REDIS_CHECKPOINT_PASSWORD:}
      database: ${REDIS_CHECKPOINT_DATABASE:0}
  audit:
    enabled: ${AGENTCODE_AUDIT_ENABLED:true}
  agent:
    max-steps: ${AGENT_MAX_STEPS:12}
    max-tokens-before-summary: ${AGENT_MAX_TOKENS_BEFORE_SUMMARY:4000}
    messages-to-keep: ${AGENT_MESSAGES_TO_KEEP:20}
    system-prompt: >-
      ${AGENT_SYSTEM_PROMPT:You are a helpful AI assistant. Use the available tools to complete the user's goal.
      When the goal is fully achieved, respond with a final answer and do not call any more tools.

      Missing information contract:
      - If the user's goal depends on data you cannot access with the available tools (no such tool,
        no data source, missing credentials, or a required identifier absent from the request), do NOT
        guess, fabricate, or present a plausible answer.
      - Try at most one reasonable lookup to confirm the capability is truly absent; if confirmed, stop immediately.
      - Then reply with exactly: (1) what specific information or access is missing, (2) why you cannot
        proceed, (3) the concrete next action for the user (e.g. please provide the order number).
      - Keep this reply short (2-3 sentences). Do not call more tools after confirming the gap, and
        do not apologize repeatedly.}
    global-context-file: ${AGENT_GLOBAL_CONTEXT_FILE:~/.agent/context.md}
    project-context-file: ${AGENT_PROJECT_CONTEXT_FILE:.agent/context.md}
    # 长期记忆全局层根目录（项目层固定在 <workspace>/.agent/memory，不受此项影响）
    memory-dir: ${AGENT_MEMORY_DIR:~/.agent/memory}

    # 需要在调用前人工审批的工具；逗号分隔，未配置时用内置 shell,write_file,edit_file
    approval-tools: ${AGENT_APPROVAL_TOOLS:shell,write_file,edit_file}

    approval:
      # 追加的 shell 通配符白名单（整条子命令匹配才生效，"git status*" 不会命中 "sudo git status"）
      allow-patterns: []
      #   - "git status*"
      #   - "ls *"
      # 追加的黑名单，优先级高于白名单与会话级放行
      deny-patterns: []
      #   - "curl *"
      # safe-commands / dangerous-commands / outside-cwd-patterns 不配置时使用 ApprovalPolicy 内置名单；
      # 一旦显式配置则整体替换对应内置名单（白名单语义下追加更容易误开放行面）
      # safe-commands: [ls, cat, pwd, echo]
      # dangerous-commands: [rm, dd, mkfs, chmod]
      # outside-cwd-patterns: ["(^|\\s)/[^\\s]", "(^|\\s)~"]

    session:
      # 空闲多久后回收 FREE 会话（连同 AgentContext 一起清理）
      idle-timeout: ${AGENT_SESSION_IDLE_TIMEOUT:30m}
      # 清理任务执行间隔（同时驱动审批等待超时检查）
      evict-interval: ${AGENT_SESSION_EVICT_INTERVAL:5m}
      # 等待人工审批超过该时长则放弃本轮审批，会话回到 FREE
      approval-wait-timeout: ${AGENT_APPROVAL_WAIT_TIMEOUT:10m}

