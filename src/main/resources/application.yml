#               command: ${MCP_STDIO_SERVER_COMMAND:}
#               args: ${MCP_STDIO_SERVER_ARGS:}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agentcode: ${AGENT_LOG_LEVEL:DEBUG}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/agentcode.log}
