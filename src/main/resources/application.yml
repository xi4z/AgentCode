spring:
  application:
    name: ${SPRING_APPLICATION_NAME:agentcode-java}

agentcode:
  agent:
    name: ${AGENT_NAME:AgentCode}
    agent-id: ${AGENT_ID:agentcode}
    system-prompt: ${AGENT_SYSTEM_PROMPT:You are a coding agent. Use the available tools to complete the user's goal. When the goal is fully achieved, answer without calling more tools.}
    max-iterations: ${AGENT_MAX_ITERATIONS:20}
    memory-enabled: ${AGENT_MEMORY_ENABLED:false}
  model:
    provider: ${AGENTCODE_MODEL_PROVIDER:openai}
    api-key: ${AGENTCODE_MODEL_API_KEY:${OPENAI_API_KEY:${DASHSCOPE_API_KEY:}}}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    dashscope-base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    name: ${AGENTCODE_MODEL_NAME:${OPENAI_CHAT_MODEL:gpt-4o-mini}}
    temperature: ${AGENTCODE_MODEL_TEMPERATURE:0.7}
    max-tokens: ${AGENTCODE_MODEL_MAX_TOKENS:8192}
  session:
    runtime-dir: ${AGENTCODE_RUNTIME_DIR:${user.home}/.agentcode}
    poll-interval-millis: ${AGENTCODE_POLL_INTERVAL_MILLIS:150}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agentcode: ${AGENT_LOG_LEVEL:DEBUG}
    io.agentscope: ${AGENTSCOPE_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/agentcode.log}
