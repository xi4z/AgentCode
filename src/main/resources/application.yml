spring:
  application:
    name: ${SPRING_APPLICATION_NAME:agentcode-java}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/agentcode?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  sql:
    init:
      # 每次启动跑一遍建表脚本（CREATE TABLE IF NOT EXISTS，幂等）；连不上库就快速失败
      mode: ${DB_INIT_MODE:always}
      schema-locations: ${DB_SCHEMA_LOCATIONS:classpath:schema.sql}

  ai:
    model:
      # openai / dashscope / anthropic / ollama
      chat: ${AI_MODEL_PROVIDER:openai}

    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}
          max-tokens: ${OPENAI_MAX_TOKENS:8192}

    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-max}
          temperature: ${DASHSCOPE_TEMPERATURE:0.7}
          top-p: ${DASHSCOPE_TOP_P:0.8}
          max-tokens: ${DASHSCOPE_MAX_TOKENS:8192}
          stop: ${DASHSCOPE_STOP:}
    chat:
      client:
        observation-enabled: ${AI_OBSERVATION_ENABLED:true}
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}

agentcode:
  # 长期记忆：三层权限 —— 全局记忆（这里，只读）/ 工作区 Agent.md（只读）/ 工作区 .memory/memory.md（agent 可写）
  memory:
    enabled: ${AGENT_MEMORY_ENABLED:true}
    file: ${AGENT_MEMORY_FILE:.memory/memory.md}
    workspace-file: ${AGENT_MEMORY_WORKSPACE_FILE:Agent.md}
    # 全局记忆正文写在这里：agent 只能读，不能改（要改得动配置并重启）
    global: ${AGENT_GLOBAL_MEMORY:}
  # 上下文压缩：长任务历史摘要
  summarization:
    enabled: ${AGENT_SUMMARIZATION_ENABLED:true}
    max-tokens: ${AGENT_SUMMARIZATION_MAX_TOKENS:4000}
    keep-messages: ${AGENT_SUMMARIZATION_KEEP_MESSAGES:20}

  agent:
    max-steps: ${AGENT_MAX_STEPS:20}
    system-prompt: ${AGENT_SYSTEM_PROMPT:You are a helpful AI assistant. Use the available tools to complete the user's goal. When the goal is fully achieved, respond with a final answer and do not call any more tools.}
    global-context-file: ${AGENT_GLOBAL_CONTEXT_FILE:~/.agent/context.md}
    project-context-file: ${AGENT_PROJECT_CONTEXT_FILE:.agent/context.md}

# 若需要配置 Spring AI 原生 MCP client，可参考：
# spring:
#   ai:
#     mcp:
#       client:
#         enabled: ${MCP_CLIENT_ENABLED:false}
#         name: ${MCP_CLIENT_NAME:agentcode}
#         version: ${MCP_CLIENT_VERSION:0.0.1}
#         type: ${MCP_CLIENT_TYPE:SYNC}
#         stdio:
#           servers:
#             - name: ${MCP_STDIO_SERVER_NAME:default}
#               command: ${MCP_STDIO_SERVER_COMMAND:}
#               args: ${MCP_STDIO_SERVER_ARGS:}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agentcode: ${AGENT_LOG_LEVEL:DEBUG}
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/agentcode.log}
