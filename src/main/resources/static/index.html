<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCode Java Chat</title>
<style>
    :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --border: #d9dee8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #dc2626;
        --success: #16a34a;
        --text: #1f2937;
        --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .app {
        width: min(960px, 96vw);
        height: min(760px, 94vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; }
    .run-badge {
        font-size: 12px;
        color: var(--muted);
        background: #eef2ff;
        padding: 3px 8px;
        border-radius: 999px;
    }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    button {
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: background .15s;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.secondary { background: #eef2ff; color: var(--primary); }
    button.secondary:hover { background: #e0e7ff; }
    button.danger { background: #fee2e2; color: var(--danger); }
    button.danger:hover { background: #fecaca; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .session-box {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .row { display: flex; gap: 8px; }
    input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 14px;
        font-family: inherit;
        resize: none;
    }
    textarea { min-height: 52px; }
    #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        background: #fafbff;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .msg {
        max-width: 85%;
        padding: 9px 12px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: #dbeafe; }
    .msg.assistant { align-self: flex-start; background: #ffffff; border: 1px solid var(--border); }
    .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
    .msg.tool { align-self: flex-start; background: #f3f4f6; border: 1px solid var(--border); color: #374151; }
    .msg.permission {
        align-self: center;
        background: #fef3c7;
        border: 1px solid #fbbf24;
        color: #78350f;
        text-align: center;
    }
    .permission-actions { display: flex; gap: 6px; margin-top: 8px; }
    footer {
        border-top: 1px solid var(--border);
        padding: 12px 18px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }
    footer textarea { flex: 1; }
    @media (max-width: 600px) {
        .app { height: 100vh; width: 100vw; border-radius: 0; }
    }
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>AgentCode Java Chat</h1>
        <span class="run-badge" id="runBadge">未开始会话</span>
        <div class="header-actions">
            <button class="secondary" id="interruptBtn" disabled>Interrupt</button>
            <button class="danger" id="stopBtn" disabled>Stop</button>
        </div>
    </header>

    <div class="session-box">
        <div class="row">
            <input type="text" id="workspace" placeholder="工作区路径, 例如 /tmp 或当前项目路径" value="/tmp">
            <button class="primary" id="startBtn">开始会话</button>
        </div>
        <textarea id="goal" placeholder="输入本轮目标, 例如: 列出当前目录下的文件"></textarea>
    </div>

    <div id="log"></div>

    <footer>
        <textarea id="chatInput" placeholder="进行多轮对话..." disabled></textarea>
        <button class="primary" id="sendBtn" disabled>发送</button>
    </footer>
</div>

<script>
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat';
let ws = null;
let runId = null;
let busy = false;
let permissions = new Map();

const log = document.getElementById('log');
const runBadge = document.getElementById('runBadge');
const startBtn = document.getElementById('startBtn');
const interruptBtn = document.getElementById('interruptBtn');
const stopBtn = document.getElementById('stopBtn');
const sendBtn = document.getElementById('sendBtn');
const chatInput = document.getElementById('chatInput');

function appendMessage(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    if (text !== undefined && text !== null) {
        div.textContent = text;
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
}

function setBusy(value) {
    busy = value;
    sendBtn.disabled = !value || !runId;
    chatInput.disabled = !value || !runId;
    interruptBtn.disabled = !value || !runId;
    stopBtn.disabled = !value || !runId;
    startBtn.disabled = value;
}

function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
        appendMessage('system', 'WebSocket 已连接: ' + wsUrl);
    };
    ws.onclose = () => {
        appendMessage('system', 'WebSocket 连接已断开');
        setBusy(false);
        startBtn.disabled = false;
    };
    ws.onerror = () => appendMessage('system', 'WebSocket 出错');
    ws.onmessage = (event) => handleServerMessage(JSON.parse(event.data));
}

function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
    }
}

function nextRequestId() {
    return 'r' + Date.now() + '-' + Math.random().toString(16).slice(2, 8);
}

function handleServerMessage(msg) {
    switch (msg.type) {
        case 'session_started':
            runId = msg.runId;
            runBadge.textContent = '会话: ' + runId;
            appendMessage('system', '会话已创建: ' + runId);
            appendMessage('assistant', '会话创建成功，开始执行目标...');
            break;

        case 'agent_event':
            appendAgentEvent(msg.status, msg.content);
            break;

        case 'permission_requested':
            permissions.set(msg.toolCallId, msg);
            appendPermissionRequest(msg);
            break;

        case 'done':
            setBusy(false);
            appendMessage('system', '本轮完成');
            break;

        case 'error':
            setBusy(false);
            appendMessage('system', '错误: ' + msg.message);
            break;

        case 'stopped':
            setBusy(false);
            appendMessage('system', '已停止');
            break;

        case 'interrupted':
            setBusy(false);
            appendMessage('system', '已中断: ' + msg.message);
            break;

        default:
            appendMessage('system', '未知消息: ' + JSON.stringify(msg));
    }
}

function appendAgentEvent(status, content) {
    if (status === 'PERMISSION_REQUESTED') {
        return;
    }
    if (status === 'TOOL_FINISHED') {
        appendMessage('tool', '[工具执行完成]');
        return;
    }
    if (status === 'THINKING_STREAMING') {
        appendMessage('assistant', content);
        return;
    }
    if (status === 'RESPONSE_STREAMING') {
        appendMessage('assistant', content);
        return;
    }
    if (status === 'TOOL_STREAMING') {
        appendMessage('tool', '调用工具: ' + content);
        return;
    }
    appendMessage('assistant', (status || '') + ' ' + (content || ''));
}

function appendPermissionRequest(msg) {
    const div = appendMessage('permission', '🔐 工具审批: ' + msg.toolName + ' ' + (msg.description || ''));
    div.appendChild(document.createTextNode('\n参数: ' + (msg.arguments || '')));

    const actions = document.createElement('div');
    actions.className = 'permission-actions';

    const approve = document.createElement('button');
    approve.className = 'primary';
    approve.textContent = '批准';
    approve.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'APPROVED',
            arguments: msg.arguments
        });
        div.remove();
        appendMessage('system', '已批准工具调用: ' + msg.toolName);
    };

    const approveAll = document.createElement('button');
    approveAll.className = 'secondary';
    approveAll.textContent = '本会话全部批准';
    approveAll.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'APPROVE_ALL',
            arguments: msg.arguments
        });
        div.remove();
        appendMessage('system', '已批准并记录到本会话: ' + msg.toolName);
    };

    const reject = document.createElement('button');
    reject.className = 'danger';
    reject.textContent = '拒绝';
    reject.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'REJECTED',
            arguments: msg.arguments
        });
        div.remove();
        appendMessage('system', '已拒绝工具调用: ' + msg.toolName);
    };

    actions.appendChild(approve);
    actions.appendChild(approveAll);
    actions.appendChild(reject);
    div.appendChild(actions);
}

startBtn.onclick = () => {
    const goal = document.getElementById('goal').value.trim();
    if (!goal) {
        appendMessage('system', '请先输入目标');
        return;
    }
    setBusy(true);
    appendMessage('user', goal);
    send({
        type: 'start_session',
        requestId: nextRequestId(),
        goal,
        workspace: document.getElementById('workspace').value.trim() || '/tmp'
    });
};

sendBtn.onclick = () => {
    const text = chatInput.value.trim();
    if (!text || !runId || busy) return;
    setBusy(true);
    appendMessage('user', text);
    send({
        type: 'chat',
        requestId: nextRequestId(),
        runId,
        content: text
    });
    chatInput.value = '';
};

chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
    }
});

interruptBtn.onclick = () => {
    if (!runId) return;
    const guidance = prompt('输入中断引导语（可选）', '请停止当前操作');
    send({
        type: 'interrupt',
        requestId: nextRequestId(),
        runId,
        guidance: guidance || ''
    });
};

stopBtn.onclick = () => {
    if (!runId) return;
    send({
        type: 'stop',
        requestId: nextRequestId(),
        runId
    });
};

connect();
</script>
</body>
</html>
