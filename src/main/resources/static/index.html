<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCode Java Chat</title>
<style>
    :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --border: #d9dee8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #dc2626;
        --success: #16a34a;
        --text: #1f2937;
        --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .app {
        width: min(960px, 96vw);
        height: min(760px, 94vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; }
    .run-badge {
        font-size: 12px;
        color: var(--muted);
        background: #eef2ff;
        padding: 3px 8px;
        border-radius: 999px;
    }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    button {
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        transition: background .15s;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.secondary { background: #eef2ff; color: var(--primary); }
    button.secondary:hover { background: #e0e7ff; }
    button.danger { background: #fee2e2; color: var(--danger); }
    button.danger:hover { background: #fecaca; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .session-box {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .row { display: flex; gap: 8px; }
    input[type="text"], textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 14px;
        font-family: inherit;
        resize: none;
    }
    textarea { min-height: 52px; }
    #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        background: #fafbff;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .msg {
        max-width: 85%;
        padding: 9px 12px;
        border-radius: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: #dbeafe; }
    .msg.assistant { align-self: flex-start; background: #ffffff; border: 1px solid var(--border); }
    .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }
    .msg.tool { align-self: flex-start; background: #f3f4f6; border: 1px solid var(--border); color: #374151; }
    .msg.permission {
        align-self: center;
        background: #fef3c7;
        border: 1px solid #fbbf24;
        color: #78350f;
        text-align: center;
    }
    .msg.markdown { white-space: normal; word-break: normal; }
    .msg.markdown p { margin: 4px 0; }
    .msg.markdown h1, .msg.markdown h2, .msg.markdown h3,
    .msg.markdown h4, .msg.markdown h5, .msg.markdown h6 { margin: 6px 0 4px; }
    .msg.markdown ul, .msg.markdown ol { margin: 4px 0; padding-left: 22px; }
    .msg.markdown pre {
        background: #1f2937;
        color: #f9fafb;
        padding: 10px 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 6px 0;
    }
    .msg.markdown pre code { background: transparent; padding: 0; color: inherit; }
    .msg.markdown code {
        background: #eef2ff;
        color: #3730a3;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 13px;
    }
    .msg.markdown a { color: var(--primary); text-decoration: underline; }
    .permission-actions { display: flex; gap: 6px; margin-top: 8px; }
    footer {
        border-top: 1px solid var(--border);
        padding: 12px 18px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }
    footer textarea { flex: 1; }
    @media (max-width: 600px) {
        .app { height: 100vh; width: 100vw; border-radius: 0; }
    }
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>AgentCode Java Chat</h1>
        <span class="run-badge" id="runBadge">未开始会话</span>
        <div class="header-actions">
            <button class="secondary" id="interruptBtn" disabled>Interrupt</button>
            <button class="danger" id="stopBtn" disabled>Stop</button>
        </div>
    </header>

    <div class="session-box">
        <div class="row">
            <input type="text" id="workspace" placeholder="工作区路径, 例如 /tmp 或当前项目路径" value="/tmp">
            <button class="primary" id="startBtn">开始会话</button>
        </div>
        <textarea id="goal" placeholder="输入本轮目标, 例如: 列出当前目录下的文件"></textarea>
    </div>

    <div id="log"></div>

    <footer>
        <textarea id="chatInput" placeholder="进行多轮对话..." disabled></textarea>
        <button class="primary" id="sendBtn" disabled>发送</button>
    </footer>
</div>

<script>
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat';
let ws = null;
let runId = null;
let busy = false;
let permissions = new Map();
/** 已发出、还没收到对应终态的请求数：每轮完成时用它决定是否解锁输入框 */
let pendingReplies = 0;
let streamBlock = null;
let streamKind = null;
let streamRaw = '';

const log = document.getElementById('log');
const runBadge = document.getElementById('runBadge');
const startBtn = document.getElementById('startBtn');
const interruptBtn = document.getElementById('interruptBtn');
const stopBtn = document.getElementById('stopBtn');
const sendBtn = document.getElementById('sendBtn');
const chatInput = document.getElementById('chatInput');

function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function renderInlineMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return html;
}

function renderMarkdown(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '';
    let inCode = false;
    let codeLang = '';
    let codeBuf = [];
    let listType = null;
    let paragraph = [];

    const flushParagraph = () => {
        if (paragraph.length) {
            html += '<p>' + renderInlineMarkdown(paragraph.join(' ')).replace(/\n/g, '<br>') + '</p>';
            paragraph = [];
        }
    };
    const flushList = () => {
        if (listType) {
            html += '</' + listType + '>';
            listType = null;
        }
    };

    for (const line of lines) {
        if (line.trim().startsWith('```')) {
            if (inCode) {
                html += '<pre><code' + (codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : '') + '>'
                    + escapeHtml(codeBuf.join('\n')) + '</code></pre>';
                inCode = false;
                codeLang = '';
                codeBuf = [];
            } else {
                flushParagraph();
                flushList();
                inCode = true;
                codeLang = line.trim().slice(3).trim();
            }
            continue;
        }
        if (inCode) {
            codeBuf.push(line);
            continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
            flushParagraph();
            flushList();
            const level = heading[1].length;
            html += '<h' + level + '>' + renderInlineMarkdown(heading[2]) + '</h' + level + '>';
            continue;
        }

        const ul = line.match(/^\s*[-*]\s+(.*)$/);
        if (ul) {
            flushParagraph();
            if (listType !== 'ul') {
                flushList();
                html += '<ul>';
                listType = 'ul';
            }
            html += '<li>' + renderInlineMarkdown(ul[1]) + '</li>';
            continue;
        }

        const ol = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ol) {
            flushParagraph();
            if (listType !== 'ol') {
                flushList();
                html += '<ol>';
                listType = 'ol';
            }
            html += '<li>' + renderInlineMarkdown(ol[1]) + '</li>';
            continue;
        }

        if (line.trim() === '') {
            flushParagraph();
            flushList();
            continue;
        }

        paragraph.push(line.trim());
    }

    if (inCode && codeBuf.length) {
        html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>';
    }
    flushParagraph();
    flushList();
    return html;
}

function appendMessage(kind, text, options) {
    options = options || {};
    const div = document.createElement('div');
    div.className = 'msg ' + kind + (options.markdown ? ' markdown' : '');
    if (text !== undefined && text !== null) {
        if (options.markdown) {
            div.innerHTML = renderMarkdown(text);
        } else {
            div.textContent = text;
        }
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
}

function finalizeStream() {
    streamBlock = null;
    streamKind = null;
    streamRaw = '';
}

/**
 * 输入框只在"没有会话"时禁用：之前用 busy 同时控制可编辑性，导致每轮结束后 footer
 * 永久置灰（busy=false → disabled），多轮对话实际用不了。忙碌时挡住的是"发送"，
 * 打字本身可以随时进行。
 */
function setBusy(value) {
    busy = value;
    chatInput.disabled = !runId;
    sendBtn.disabled = !runId || value;
    interruptBtn.disabled = !runId || !value;
    stopBtn.disabled = !runId || !value;
    startBtn.disabled = value || !!runId;
}

/** 所有请求都有终态了才解锁输入框 */
function releaseIfIdle() {
    if (pendingReplies <= 0) {
        pendingReplies = 0;
        setBusy(false);
    }
}

function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
        appendMessage('system', 'WebSocket 已连接: ' + wsUrl);
    };
    ws.onclose = () => {
        appendMessage('system', 'WebSocket 连接已断开');
        setBusy(false);
        startBtn.disabled = false;
    };
    ws.onerror = () => appendMessage('system', 'WebSocket 出错');
    ws.onmessage = (event) => handleServerMessage(JSON.parse(event.data));
}

/**
 * 发一条请求。expectDone=false 用于不计入终态等待的请求：
 * 审批答复不另起一轮，它的终态就是同一轮的那个 done/error/stopped/interrupted。
 */
function send(obj, expectDone = true) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        if (expectDone) {
            pendingReplies++;
        }
        ws.send(JSON.stringify(obj));
    }
}

function nextRequestId() {
    return 'r' + Date.now() + '-' + Math.random().toString(16).slice(2, 8);
}

function handleServerMessage(msg) {
    switch (msg.type) {
        // 一次请求的终态：done/error/stopped/interrupted 各是一次请求的收口
        case 'done':
        case 'error':
        case 'stopped':
        case 'interrupted':
            pendingReplies--;
            break;
    }
    switch (msg.type) {
        case 'session_started':
            runId = msg.runId;
            runBadge.textContent = '会话: ' + runId;
            appendMessage('system', '会话已创建: ' + runId);
            appendMessage('assistant', '会话创建成功，开始执行目标...');
            break;

        case 'agent_event':
            appendAgentEvent(msg.status, msg.content);
            break;

        case 'permission_requested':
            finalizeStream();
            permissions.set(msg.toolCallId, msg);
            appendPermissionRequest(msg);
            break;

        case 'done':
            finalizeStream();
            releaseIfIdle();
            appendMessage('system', '本轮完成');
            break;

        case 'error':
            finalizeStream();
            releaseIfIdle();
            appendMessage('system', '错误: ' + msg.message);
            break;

        case 'stopped':
            finalizeStream();
            releaseIfIdle();
            appendMessage('system', '已停止');
            break;

        case 'interrupted':
            finalizeStream();
            releaseIfIdle();
            appendMessage('system', '已中断' + (msg.message ? ': ' + msg.message : ''));
            break;

        default:
            appendMessage('system', '未知消息: ' + JSON.stringify(msg));
    }
}

function appendAgentEvent(status, content) {
    if (status === 'PERMISSION_REQUESTED') {
        return;
    }
    if (status === 'TOOL_FINISHED') {
        appendMessage('tool', '[工具执行完成]');
        return;
    }
    if (status === 'THINKING_STREAMING' || status === 'RESPONSE_STREAMING') {
        const kind = status === 'THINKING_STREAMING' ? 'thinking' : 'response';
        if (streamBlock && streamKind === kind) {
            streamRaw += content || '';
            streamBlock.innerHTML = renderMarkdown(streamRaw);
        } else {
            streamRaw = content || '';
            streamBlock = appendMessage('assistant', streamRaw, {markdown: true});
            streamKind = kind;
        }
        log.scrollTop = log.scrollHeight;
        return;
    }
    if (status === 'THINKING_FINISHED') {
        if (streamBlock && streamKind === 'thinking') {
            if (content) {
                streamRaw = content;
                streamBlock.innerHTML = renderMarkdown(content);
            }
        } else {
            appendMessage('assistant', content || '', {markdown: true});
        }
        finalizeStream();
        return;
    }
    if (status === 'RESPONSE_FINISHED') {
        if (streamBlock && streamKind === 'response') {
            if (content) {
                streamRaw = content;
                streamBlock.innerHTML = renderMarkdown(content);
            }
        } else {
            appendMessage('assistant', content || '', {markdown: true});
        }
        finalizeStream();
        return;
    }
    if (status === 'TOOL_STREAMING') {
        appendMessage('tool', '调用工具: ' + content);
        return;
    }
    appendMessage('assistant', (status || '') + ' ' + (content || ''));
}

function appendPermissionRequest(msg) {
    const div = appendMessage('permission', '🔐 工具审批: ' + msg.toolName + ' ' + (msg.description || ''));
    div.appendChild(document.createTextNode('\n参数: ' + (msg.arguments || '')));

    const actions = document.createElement('div');
    actions.className = 'permission-actions';

    const approve = document.createElement('button');
    approve.className = 'primary';
    approve.textContent = '批准';
    approve.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'APPROVED',
            arguments: msg.arguments
        }, false);
        div.remove();
        appendMessage('system', '已批准工具调用: ' + msg.toolName);
    };

    const approveAll = document.createElement('button');
    approveAll.className = 'secondary';
    approveAll.textContent = '本会话全部批准';
    approveAll.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'APPROVE_ALL',
            arguments: msg.arguments
        }, false);
        div.remove();
        appendMessage('system', '已批准并记录到本会话: ' + msg.toolName);
    };

    const reject = document.createElement('button');
    reject.className = 'danger';
    reject.textContent = '拒绝';
    reject.onclick = () => {
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'REJECTED',
            arguments: msg.arguments
        }, false);
        div.remove();
        appendMessage('system', '已拒绝工具调用: ' + msg.toolName);
    };

    // EDITED：先改参数再执行，后端按改后的参数跑（AgentInterruptHandle.Decision.EDITED）
    const edit = document.createElement('button');
    edit.className = 'secondary';
    edit.textContent = '改参数';
    edit.onclick = () => {
        const edited = prompt('修改本次工具调用的参数（JSON）', msg.arguments || '{}');
        if (edited === null) return;
        const trimmed = edited.trim();
        let args;
        try {
            args = JSON.stringify(JSON.parse(trimmed));
        } catch (e) {
            args = JSON.stringify({ command: trimmed }); // 非 JSON 就当 shell 命令
        }
        permissions.delete(msg.toolCallId);
        send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: 'EDITED',
            arguments: args,
            feedback: '用户在 UI 上修改了参数'
        }, false);
        div.remove();
        appendMessage('system', '已按修改后的参数执行: ' + msg.toolName + ' ' + args);
    };

    actions.appendChild(approve);
    actions.appendChild(approveAll);
    actions.appendChild(edit);
    actions.appendChild(reject);
    div.appendChild(actions);
}

startBtn.onclick = () => {
    const goal = document.getElementById('goal').value.trim();
    if (!goal) {
        appendMessage('system', '请先输入目标');
        return;
    }
    setBusy(true);
    appendMessage('user', goal);
    send({
        type: 'start_session',
        requestId: nextRequestId(),
        goal,
        workspace: document.getElementById('workspace').value.trim() || '/tmp'
    });
};

sendBtn.onclick = () => {
    const text = chatInput.value.trim();
    if (!text || !runId || busy) return;
    setBusy(true);
    appendMessage('user', text);
    send({
        type: 'chat',
        requestId: nextRequestId(),
        runId,
        content: text
    });
    chatInput.value = '';
};

chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
    }
});

interruptBtn.onclick = () => {
    if (!runId) return;
    const guidance = prompt('输入中断引导语（可选）', '请停止当前操作');
    send({
        type: 'interrupt',
        requestId: nextRequestId(),
        runId,
        guidance: guidance || ''
    });
};

stopBtn.onclick = () => {
    if (!runId) return;
    send({
        type: 'stop',
        requestId: nextRequestId(),
        runId
    });
};

connect();
</script>
</body>
</html>
