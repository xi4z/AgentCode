<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCode TUI</title>
<style>
    :root {
        --bg: #0b0f14;
        --bg-alt: #0f151c;
        --border: #1e2a38;
        --text: #d4dbe2;
        --muted: #5f7485;
        --green: #4ade80;
        --cyan: #22d3ee;
        --yellow: #facc15;
        --red: #f87171;
        --blue: #60a5fa;
        --purple: #c084fc;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
        font-size: 14px;
    }

    #tui {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 1200px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        background: var(--bg);
    }

    #titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: var(--bg-alt);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        user-select: none;
        flex-shrink: 0;
    }
    #titlebar .title {
        color: var(--green);
        font-weight: bold;
        letter-spacing: .4px;
    }
    #titlebar .dot {
        color: var(--green);
    }
    #titlebar .status {
        margin-left: auto;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .8px;
    }
    #titlebar .status.connected { color: var(--green); }
    #titlebar .status.running  { color: var(--cyan); }
    #titlebar .status.waiting  { color: var(--yellow); }
    #titlebar .status.error    { color: var(--red); }
    #titlebar .status.connecting { color: var(--yellow); }
    #titlebar .shortcut {
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 2px 7px;
        border-radius: 4px;
    }

    #terminal {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 20px;
        line-height: 1.6;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
        word-break: break-word;
    }
    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .line {
        white-space: pre-wrap;
        margin-bottom: 2px;
        min-height: 1em;
    }
    .line.user { color: var(--text); }
    .line.user::before { content: "❯ "; color: var(--green); }
    .line.assistant { color: var(--text); }
    .line.assistant::before { content: "▍"; color: var(--blue); }
    .line.thinking { color: var(--muted); font-style: italic; }
    .line.thinking::before { content: "💭 "; color: var(--muted); }
    .line.tool { color: var(--cyan); }
    .line.tool::before { content: "🔧 "; color: var(--cyan); }
    .line.system { color: var(--muted); }
    .line.system::before { content: "• "; color: var(--muted); }
    .line.error { color: var(--red); }
    .line.error::before { content: "✗ "; color: var(--red); }
    .line.success { color: var(--green); }
    .line.success::before { content: "✓ "; color: var(--green); }

    .line.permission {
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid #4d3e00;
        background: #151205;
        color: var(--yellow);
        border-radius: 6px;
    }
    .line.permission .perm-title { color: var(--yellow); font-weight: bold; }
    .line.permission .perm-meta { color: var(--text); }
    .line.permission .perm-args {
        display: block;
        margin: 4px 0 8px;
        padding: 6px 8px;
        background: #0a0e12;
        border: 1px solid var(--border);
        color: #bbf7d0;
        border-radius: 4px;
        white-space: pre-wrap;
        font-size: 13px;
    }
    .perm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .perm-actions .key {
        cursor: pointer;
        display: inline-block;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-alt);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        user-select: none;
    }
    .perm-actions .key:hover { border-color: var(--cyan); color: var(--cyan); }
    .perm-actions .key.approve { border-color: #14532d; color: var(--green); }
    .perm-actions .key.approve:hover { background: rgba(74,222,128,.08); }
    .perm-actions .key.reject { border-color: #7f1d1d; color: var(--red); }
    .perm-actions .key.reject:hover { background: rgba(248,113,113,.08); }
    .perm-actions .key[disabled] { opacity: .4; cursor: not-allowed; }
    .line.permission.resolved { opacity: .55; }
    .line.permission.resolved .perm-actions { display: none; }

    #inputline {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--bg-alt);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
    }
    #prompt {
        color: var(--green);
        white-space: nowrap;
    }
    #prompt .workspace {
        color: var(--muted);
        margin-left: 2px;
    }
    #cli {
        flex: 1;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        caret-color: var(--green);
    }
    #cli::placeholder { color: var(--muted); }

    #completion {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        padding: 6px 14px 8px;
        background: #0d131a;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        max-height: 150px;
        overflow-y: auto;
        flex-shrink: 0;
    }
    #completion[hidden] { display: none; }
    #completion .completion-hint {
        width: 100%;
        color: var(--muted);
        font-size: 12px;
        user-select: none;
    }
    #completion .completion-item {
        cursor: pointer;
        padding: 1px 7px;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--text);
        white-space: nowrap;
        user-select: none;
    }
    #completion .completion-item:hover {
        border-color: var(--border);
        color: var(--text);
    }
    #completion .completion-item.active {
        border-color: var(--cyan);
        color: var(--cyan);
        background: rgba(34, 211, 238, .08);
    }

    @media (max-width: 600px) {
        #tui { border-left: 0; border-right: 0; }
        #titlebar .shortcut { display: none; }
    }
</style>
</head>
<body>
<div id="tui">
    <div id="titlebar">
        <span class="dot">●</span>
        <span class="title">AgentCode TUI</span>
        <span class="status" id="statusText">CONNECTING</span>
        <span class="shortcut">/help</span>
        <span class="shortcut">Ctrl+L 清屏</span>
    </div>

    <div id="terminal" role="log" aria-live="polite"></div>

    <div id="completion" hidden></div>

    <div id="inputline">
        <span id="prompt">agentcode❯<span class="workspace" id="workspaceText">/tmp</span></span>
        <input id="cli" type="text" autocomplete="off" spellcheck="false" autofocus
               placeholder="输入目标开始新会话；已有会话时输入消息继续对话。 /help 查看命令">
    </div>
</div>

<script>
(function () {
    'use strict';

    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat';

    // ---- state ----
    let ws = null;
    let reconnectTimer = null;
    let manualClose = false;
    let runId = null;
    let busy = false;
    let workspace = '/tmp';
    let pending = new Map();      // toolCallId -> permission message
    let streamLine = null;
    let streamKind = null;

    // 可补全的斜杠命令（TUI 命令补全模式）
    const COMMANDS = [
        '/approve',
        '/approve_all',
        '/clear',
        '/goal',
        '/help',
        '/interrupt',
        '/new',
        '/reject',
        '/status',
        '/stop',
        '/workspace'
    ];
    let completionMatches = [];
    let completionIndex = -1;
    let completionLastInput = '';

    // ---- DOM ----
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('statusText');
    const workspaceText = document.getElementById('workspaceText');
    const cli = document.getElementById('cli');
    const prompt = document.getElementById('prompt');
    const completionBox = document.getElementById('completion');

    function updateWorkspaceLabel() {
        workspaceText.textContent = ' ' + workspace;
    }

    function updateStatus() {
        const connected = ws && ws.readyState === WebSocket.OPEN;
        if (!connected) {
            statusText.textContent = 'DISCONNECTED';
            statusText.className = 'status error';
            return;
        }
        if (pending.size > 0) {
            statusText.textContent = 'WAITING APPROVAL ×' + pending.size;
            statusText.className = 'status waiting';
            return;
        }
        if (busy) {
            statusText.textContent = 'RUNNING';
            statusText.className = 'status running';
            return;
        }
        if (runId) {
            statusText.textContent = 'IDLE · ' + shortId(runId);
            statusText.className = 'status connected';
        } else {
            statusText.textContent = 'READY';
            statusText.className = 'status connected';
        }
    }

    function shortId(id) {
        if (!id) return '';
        return id.length > 12 ? id.slice(0, 8) + '…' + id.slice(-4) : id;
    }

    function scrollToBottom() {
        terminal.scrollTop = terminal.scrollHeight;
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function prettyJson(text) {
        if (!text) return '';
        try {
            return JSON.stringify(JSON.parse(text), null, 2);
        } catch (e) {
            return text;
        }
    }

    // append a non-streaming line into terminal
    function writeLine(kind, text) {
        finishStream();
        const div = document.createElement('div');
        div.className = 'line ' + kind;
        div.textContent = text == null ? '' : String(text);
        terminal.appendChild(div);
        scrollToBottom();
        return div;
    }

    // streaming sections (thinking/response) update one line until the matching *_FINISHED event
    function writeStream(kind, text) {
        if (streamLine && streamLine.dataset.kind === kind) {
            streamLine.textContent += text == null ? '' : String(text);
        } else {
            finishStream();
            const div = document.createElement('div');
            div.className = 'line ' + kind;
            div.dataset.kind = kind;
            div.textContent = text == null ? '' : String(text);
            terminal.appendChild(div);
            streamLine = div;
            streamKind = kind;
        }
        scrollToBottom();
    }

    function finishStream() {
        if (streamLine) {
            streamLine = null;
            streamKind = null;
        }
    }

    function setBusy(value) {
        busy = value;
        updateStatus();
    }

    // ---- WebSocket ----
    function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
            return true;
        }
        writeLine('error', 'WebSocket 未连接，消息发送失败');
        return false;
    }

    function nextRequestId() {
        return 'r' + Date.now() + '-' + Math.random().toString(16).slice(2, 8);
    }

    function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
        }
        manualClose = false;
        statusText.textContent = 'CONNECTING';
        statusText.className = 'status connecting';

        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
            writeLine('system', 'WebSocket 已连接: ' + wsUrl);
            updateStatus();
        };

        ws.onclose = function () {
            writeLine('system', 'WebSocket 连接已断开');
            setBusy(false);
            updateStatus();
            if (!manualClose) {
                scheduleReconnect();
            }
        };

        ws.onerror = function () {
            writeLine('error', 'WebSocket 出错');
            updateStatus();
        };

        ws.onmessage = function (event) {
            let msg;
            try {
                msg = JSON.parse(event.data);
            } catch (e) {
                writeLine('error', '无法解析消息: ' + event.data);
                return;
            }
            handleServerMessage(msg);
        };
    }

    function scheduleReconnect() {
        if (reconnectTimer) return;
        writeLine('system', '3 秒后自动重连...');
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, 3000);
    }

    // ---- protocol handling ----
    function handleServerMessage(msg) {
        switch (msg.type) {
            case 'session_started':
                runId = msg.runId;
                writeLine('user', '开始会话: ' + msg.runId);
                writeLine('system', '会话已创建: ' + runId);
                updateStatus();
                break;

            case 'agent_event':
                handleAgentEvent(msg.status, msg.content);
                break;

            case 'permission_requested':
                handlePermissionRequested(msg);
                break;

            case 'permission_pending': {
                finishStream();
                let remaining = [];
                try {
                    remaining = JSON.parse(msg.content || '[]');
                } catch (e) { /* ignore */ }
                writeLine('system', '已记录决定，仍在等待 ' + remaining.length + ' 项审批');
                updateStatus();
                break;
            }

            case 'done':
                finishStream();
                setBusy(false);
                writeLine('success', '本轮完成');
                updateStatus();
                break;

            case 'error':
                finishStream();
                setBusy(false);
                writeLine('error', '错误: ' + (msg.message || ''));
                updateStatus();
                break;

            case 'stopped':
                finishStream();
                setBusy(false);
                writeLine('system', '已停止');
                updateStatus();
                break;

            case 'interrupted':
                finishStream();
                setBusy(false);
                writeLine('system', '已中断: ' + (msg.message || ''));
                updateStatus();
                break;

            default:
                finishStream();
                writeLine('system', '未知消息: ' + JSON.stringify(msg));
        }
    }

    function handleAgentEvent(status, content) {
        if (status === 'PERMISSION_REQUESTED' || status === 'PERMISSION_PENDING') return;

        switch (status) {
            case 'THINKING_STREAMING':
                writeStream('thinking', content);
                break;
            case 'RESPONSE_STREAMING':
                writeStream('assistant', content);
                break;
            case 'TOOL_STREAMING':
                finishStream();
                writeLine('tool', '调用工具: ' + (content || ''));
                break;
            case 'TOOL_FINISHED':
                finishStream();
                writeLine('tool', '[工具执行完成]');
                break;
            case 'THINKING_FINISHED':
                if (streamLine && streamLine.dataset.kind === 'thinking') {
                    if (content) {
                        streamLine.textContent = content;
                        scrollToBottom();
                    }
                    finishStream();
                } else {
                    writeLine('thinking', (content || ''));
                }
                break;
            case 'RESPONSE_FINISHED':
                if (streamLine && streamLine.dataset.kind === 'assistant') {
                    if (content) {
                        streamLine.textContent = content;
                        scrollToBottom();
                    }
                    finishStream();
                } else {
                    writeLine('assistant', (content || ''));
                }
                break;
            default:
                finishStream();
                writeLine('system', (status || '') + ' ' + (content || ''));
        }
    }

    // ---- permissions ----
    function handlePermissionRequested(msg) {
        finishStream();
        if (!pending.has(msg.toolCallId)) {
            pending.set(msg.toolCallId, msg);
        }
        appendPermissionBlock(msg);
        setBusy(true);
        updateStatus();
    }

    function appendPermissionBlock(msg) {
        const div = document.createElement('div');
        div.className = 'line permission';
        div.dataset.toolCallId = msg.toolCallId;

        const title = document.createElement('span');
        title.className = 'perm-title';
        title.textContent = '🔐 工具审批';
        div.appendChild(title);

        const meta = document.createElement('span');
        meta.className = 'perm-meta';
        meta.textContent = '  ' + (msg.toolName || 'unknown') + '  ·  ' + (msg.toolCallId || '');
        div.appendChild(meta);

        if (msg.description) {
            const desc = document.createElement('div');
            desc.className = 'perm-meta';
            desc.textContent = '说明: ' + msg.description;
            div.appendChild(desc);
        }

        const args = document.createElement('span');
        args.className = 'perm-args';
        args.textContent = prettyJson(msg.arguments || '{}');
        div.appendChild(args);

        const actions = document.createElement('div');
        actions.className = 'perm-actions';

        actions.appendChild(makePermKey('A 批准', 'approve', function () {
            answerPermission(msg, 'APPROVED');
        }));
        actions.appendChild(makePermKey('ALL 全部批准', 'approve', function () {
            answerPermission(msg, 'APPROVE_ALL');
        }));
        actions.appendChild(makePermKey('E 编辑参数', '', function () {
            const edited = window.prompt('修改后的 arguments JSON', msg.arguments || '{}');
            if (edited === null) return;
            try {
                JSON.parse(edited);
            } catch (e) {
                writeLine('error', '编辑后的参数不是合法 JSON');
                return;
            }
            answerPermission(msg, 'EDITED', edited);
        }));
        actions.appendChild(makePermKey('N 拒绝', 'reject', function () {
            answerPermission(msg, 'REJECTED');
        }));

        div.appendChild(actions);
        terminal.appendChild(div);
        scrollToBottom();
        cli.focus();
    }

    function makePermKey(label, cls, handler) {
        const button = document.createElement('span');
        button.className = 'key' + (cls ? ' ' + cls : '');
        button.textContent = '[' + label + ']';
        button.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            handler();
        });
        return button;
    }

    function answerPermission(msg, decision, editedArgs) {
        if (!pending.has(msg.toolCallId)) return;
        const ok = send({
            type: 'permission_respond',
            requestId: nextRequestId(),
            runId: runId,
            toolCallId: msg.toolCallId,
            toolName: msg.toolName,
            decision: decision,
            arguments: editedArgs !== undefined ? editedArgs : (msg.arguments || '')
        });
        if (!ok) return;

        pending.delete(msg.toolCallId);
        markPermissionResolved(msg.toolCallId, decision);
        if (pending.size === 0) {
            writeLine('system', '已提交全部审批，等待 Agent 继续执行...');
        } else {
            writeLine('system', '已提交 ' + decision + '，仍等待 ' + pending.size + ' 项审批');
        }
        updateStatus();
        cli.focus();
    }

    function markPermissionResolved(toolCallId, decision) {
        const blocks = terminal.querySelectorAll('.line.permission[data-tool-call-id="' + CSS.escape(toolCallId) + '"]');
        for (const block of blocks) {
            block.classList.add('resolved');
            const title = block.querySelector('.perm-title');
            if (title) title.textContent = '🔐 已提交: ' + decision + '  ' + toolCallId;
        }
    }

    // ---- command completion ----
    function getCompletionMatches(input) {
        const prefix = input.toLowerCase();
        return COMMANDS.filter(function (cmd) {
            return cmd.toLowerCase().startsWith(prefix);
        });
    }

    function renderCompletion(matches, activeIndex) {
        if (!matches.length) {
            completionBox.hidden = true;
            completionBox.innerHTML = '';
            return;
        }

        completionBox.hidden = false;
        completionBox.innerHTML = '';
        const hint = document.createElement('div');
        hint.className = 'completion-hint';
        hint.textContent = 'Tab 循环补全 · 单击使用';
        completionBox.appendChild(hint);

        matches.forEach(function (cmd, i) {
            const item = document.createElement('span');
            item.className = 'completion-item' + (i === activeIndex ? ' active' : '');
            item.textContent = cmd;
            item.dataset.cmd = cmd;
            item.addEventListener('click', function () {
                cli.value = cmd + ' ';
                hideCompletion();
                cli.focus();
            });
            completionBox.appendChild(item);
        });
    }

    function hideCompletion() {
        completionMatches = [];
        completionIndex = -1;
        completionLastInput = '';
        completionBox.hidden = true;
        completionBox.innerHTML = '';
    }

    function updateCompletion(resetIndex) {
        const raw = cli.value;
        if (!raw.startsWith('/') || /\s/.test(raw)) {
            hideCompletion();
            return;
        }

        const matches = getCompletionMatches(raw);
        if (resetIndex !== false) {
            completionIndex = -1;
        }
        completionMatches = matches;
        completionLastInput = raw;
        renderCompletion(matches, completionIndex);
    }

    function handleTabCompletion() {
        const raw = cli.value;
        if (!raw.startsWith('/') || /\s/.test(raw)) {
            return false;
        }

        const matches = getCompletionMatches(raw);
        if (!matches.length) {
            return false;
        }

        if (completionLastInput !== raw) {
            completionIndex = 0;
        } else {
            completionIndex = (completionIndex + 1) % matches.length;
        }
        completionMatches = matches;

        const candidate = matches[completionIndex];
        if (matches.length === 1) {
            cli.value = candidate + ' ';
            hideCompletion();
        } else {
            cli.value = candidate;
            completionLastInput = candidate;
            renderCompletion(matches, completionIndex);
        }
        return true;
    }

    // ---- user commands ----
    function startSession(goal) {
        if (!goal.trim()) {
            writeLine('error', '目标不能为空');
            return;
        }
        if (busy) {
            writeLine('error', '当前有任务正在执行，请先等待完成，或使用 /interrupt /stop');
            return;
        }
        setBusy(true);
        writeLine('user', goal);
        const ok = send({
            type: 'start_session',
            requestId: nextRequestId(),
            goal: goal,
            workspace: workspace
        });
        if (!ok) {
            setBusy(false);
            return;
        }
        updateStatus();
    }

    function sendChat(content) {
        if (!runId) {
            writeLine('error', '还没有会话，请直接输入目标创建新会话');
            return;
        }
        if (busy) {
            writeLine('error', '当前有任务正在执行，请先等待完成，或使用 /interrupt /stop');
            return;
        }
        setBusy(true);
        writeLine('user', content);
        const ok = send({
            type: 'chat',
            requestId: nextRequestId(),
            runId: runId,
            content: content
        });
        if (!ok) {
            setBusy(false);
            return;
        }
        updateStatus();
    }

    function runCommand(raw) {
        const trimmed = raw.trim();
        const parts = trimmed.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const rest = trimmed.slice(parts[0].length).trim();

        switch (cmd) {
            case '/help':
            case '/h':
            case 'help':
            case '?':
                showHelp();
                return;
            case '/clear':
            case 'clear':
                terminal.innerHTML = '';
                return;
            case '/status':
                writeLine('system',
                    'ws=' + (ws && ws.readyState === WebSocket.OPEN ? 'connected' : 'disconnected') +
                    '  runId=' + (runId || '-') +
                    '  workspace=' + workspace +
                    '  busy=' + busy +
                    '  pending=' + pending.size);
                return;
            case '/workspace':
                if (!rest) {
                    writeLine('system', '当前工作区: ' + workspace);
                } else {
                    workspace = rest;
                    updateWorkspaceLabel();
                    writeLine('system', '工作区已设置为: ' + workspace);
                }
                return;
            case '/new':
            case '/goal':
                if (!rest) {
                    writeLine('error', '用法: ' + cmd + ' <目标文本>');
                    return;
                }
                startSession(rest);
                return;
            case '/stop':
                if (!runId) {
                    writeLine('error', '还没有会话');
                    return;
                }
                send({type: 'stop', requestId: nextRequestId(), runId: runId});
                writeLine('system', '已请求停止');
                return;
            case '/interrupt':
                if (!runId) {
                    writeLine('error', '还没有会话');
                    return;
                }
                const guidance = rest || '请停止当前操作';
                send({type: 'interrupt', requestId: nextRequestId(), runId: runId, guidance: guidance});
                writeLine('system', '已请求中断: ' + guidance);
                return;
            case '/approve':
                respondByCommand('APPROVED', rest);
                return;
            case '/approve_all':
                respondByCommand('APPROVE_ALL', rest);
                return;
            case '/reject':
                respondByCommand('REJECTED', rest);
                return;
            default:
                writeLine('error', '未知命令: ' + cmd + '，输入 /help 查看帮助');
        }
    }

    function respondByCommand(decision, toolCallIdOrEmpty) {
        if (pending.size === 0) {
            writeLine('error', '当前没有待审批的工具');
            return;
        }
        let targetId = toolCallIdOrEmpty;
        if (!targetId) {
            if (pending.size === 1) {
                targetId = Array.from(pending.keys())[0];
            } else {
                writeLine('error', '有多个待审批项，请指定 toolCallId: /' + decision.toLowerCase() + ' <toolCallId>');
                return;
            }
        }
        const msg = pending.get(targetId);
        if (!msg) {
            writeLine('error', '未找到待审批项: ' + targetId + '，当前为 ' + Array.from(pending.keys()).join(', '));
            return;
        }
        answerPermission(msg, decision);
    }

    function showHelp() {
        const lines = [
            '── AgentCode TUI 帮助 ─────────────────────────────',
            '直接输入文本',
            '  无会话时: 创建会话并执行目标',
            '  有会话空闲时: 作为多轮消息发送',
            '  任务运行时: 需要等待完成，或用 /interrupt /stop 打断',
            '',
            '命令',
            '  /help                    显示本帮助',
            '  /new <目标>               创建新会话并执行',
            '  /goal <目标>              同上',
            '  /workspace <路径>         设置工作区（默认 ' + workspace + '）',
            '  /stop                     停止当前任务',
            '  /interrupt <引导语>       中断当前思考/任务',
            '  /approve [toolCallId]     批准待审批工具',
            '  /approve_all [toolCallId] 本会话全部批准该命令',
            '  /reject [toolCallId]      拒绝待审批工具',
            '  /status                   查看状态',
            '  /clear 或 Ctrl+L          清屏',
            '',
            '审批框也支持鼠标点击: [A 批准] [ALL 全部批准] [E 编辑参数] [N 拒绝]'
        ];
        for (const line of lines) {
            const div = document.createElement('div');
            div.className = 'line system';
            div.textContent = line;
            terminal.appendChild(div);
        }
        scrollToBottom();
    }

    function handleInput() {
        const raw = cli.value.trim();
        if (!raw) {
            hideCompletion();
            return;
        }
        cli.value = '';
        hideCompletion();
        if (raw.startsWith('/') || raw === '?' || raw.toLowerCase() === 'help' || raw.toLowerCase() === 'clear') {
            runCommand(raw);
            return;
        }
        if (!runId) {
            startSession(raw);
        } else {
            sendChat(raw);
        }
    }

    // ---- events ----
    cli.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleInput();
        } else if (e.key === 'Tab') {
            if (handleTabCompletion()) {
                e.preventDefault();
            }
        } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            terminal.innerHTML = '';
        }
    });

    cli.addEventListener('input', function () {
        updateCompletion(true);
    });

    document.addEventListener('click', function () {
        if (document.activeElement !== cli) {
            cli.focus();
        }
    });

    // ---- boot ----
    updateWorkspaceLabel();
    writeLine('system', 'AgentCode Java TUI 已就绪');
    writeLine('system', '直接输入目标开始，或输入 /help 查看命令');
    updateStatus();
    connect();
})();
</script>
</body>
</html>
